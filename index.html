<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noai, noimageai">
  <title>AI Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Layout: an open page, no boxes. The latest issue sits beside a typographic
       cover; below it every issue is one quiet row under its month. */
    :root {
      --ink: #1a1917;
      --ink-muted: #5c5955;
      --ink-faint: #8f8b85;
      --paper: #fffef9;
      --line: rgba(26,25,23,0.14);
      --accent: #b5451b;
      --on-ink: #fffef9;
      --display: 'Bebas Neue', Impact, sans-serif;
      --serif: 'Lora', Georgia, serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--paper); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; border-top: 4px solid var(--accent); }
    button, select, input { font: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 40px 120px; }

    .masthead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 22px 0 20px; }
    .wordmark { font-family: var(--display); font-size: 34px; line-height: 1; letter-spacing: 0.05em; color: var(--ink-faint); }
    .wordmark b { font-weight: 400; color: var(--accent); margin-right: 8px; }
    .strap { font-size: 14px; color: var(--ink-faint); }

    .band { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 14px; }
    .band strong { font-weight: 600; }
    .band span { color: var(--ink-muted); }

    /* Latest issue */
    .feature { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: center; padding: 40px 0 64px; }
    .cover {
      aspect-ratio: 4 / 3; background: var(--ink); color: var(--on-ink); border-radius: 6px;
      display: flex; flex-direction: column; justify-content: space-between; padding: 26px 28px 22px;
    }
    .cover-date { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; opacity: 0.7; }
    .cover-label { font-family: var(--display); font-size: clamp(40px, 5.6vw, 68px); line-height: 0.95; letter-spacing: 0.02em; text-wrap: balance; }
    .cover-label::after { content: ''; display: block; width: 44px; height: 4px; background: var(--accent); margin-top: 18px; }
    .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); letter-spacing: 0.02em; }
    .feature-title { font-size: clamp(27px, 3.3vw, 38px); font-weight: 600; line-height: 1.18; letter-spacing: -0.015em; margin: 12px 0 18px; text-wrap: balance; }
    .feature-title a:hover { color: var(--accent); }
    .topics { list-style: none; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--ink-muted); }
    .topics li { padding: 10px 0; border-top: 1px solid var(--line); }
    .topics li:last-child { border-bottom: 1px solid var(--line); }
    .go { display: inline-block; margin-top: 22px; font-size: 15px; font-weight: 600; border-bottom: 1.5px solid var(--accent); padding-bottom: 2px; }
    .go:hover { color: var(--accent); }

    /* Archive controls */
    .controls { display: flex; align-items: center; gap: 8px 28px; flex-wrap: wrap; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex-shrink: 0; font-size: 15px; color: var(--ink-faint); padding: 6px 0; border-bottom: 1.5px solid transparent; white-space: nowrap; }
    .tab:hover { color: var(--ink); }
    .tab[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
    .tools { display: flex; align-items: center; gap: 20px; }
    .tools select { font-size: 14px; color: var(--ink-muted); background: transparent; border: none; border-bottom: 1px solid var(--line); padding: 6px 2px; max-width: 170px; }
    .tools input { font-size: 14px; width: 150px; background: transparent; border: none; border-bottom: 1px solid var(--line); padding: 6px 2px; outline: none; }
    .tools input:focus, .tools select:focus { border-bottom-color: var(--accent); }
    .tools input::placeholder { color: var(--ink-faint); }

    /* Months and rows */
    .month { padding-top: 44px; }
    .month-head { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; width: 100%; text-align: left; }
    .month-name { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
    .month-n { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); flex: 1; }
    .month-toggle { font-size: 14px; color: var(--accent); }
    .rows { list-style: none; border-top: 1px solid var(--line); }
    .row { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
    .row > a { flex: 1; min-width: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 0 20px; align-items: center; padding: 16px 0; }
    .day { display: flex; align-items: baseline; gap: 8px; }
    .day-num { font-family: var(--display); font-size: 40px; line-height: 0.9; color: var(--ink); min-width: 34px; }
    .row--weekly .day-num { color: var(--accent); }
    .day-dow { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
    .row-title { display: block; font-size: 19px; font-weight: 500; line-height: 1.32; text-wrap: balance; }
    .row > a:hover .row-title { color: var(--accent); }
    .row-topics { display: block; margin-top: 5px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .play-btn { flex-shrink: 0; width: 40px; height: 40px; margin-left: 12px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; }
    .play-btn:hover, .play-btn.playing { border-color: var(--accent); color: var(--accent); }
    .empty { font-size: 16px; color: var(--ink-muted); padding: 40px 0; }
    .empty button { color: var(--accent); border-bottom: 1px solid currentColor; }

    /* Audio bar */
    .audio-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); color: var(--on-ink); display: none; align-items: center; gap: 14px; padding: 10px 24px; z-index: 100; font-family: var(--mono); }
    .audio-bar.visible { display: flex; }
    .audio-bar-play { color: var(--on-ink); flex-shrink: 0; width: 28px; height: 28px; }
    .audio-bar-title { font-size: 10px; letter-spacing: 0.06em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.7; }
    .audio-bar-time { font-size: 10px; opacity: 0.45; white-space: nowrap; flex-shrink: 0; }
    .audio-bar-progress { flex: 1; max-width: 200px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 1px; cursor: pointer; flex-shrink: 0; }
    .audio-bar-fill { height: 100%; background: var(--accent); border-radius: 1px; width: 0%; pointer-events: none; }

    @media (max-width: 720px) {
      .wrap { padding: 0 20px 96px; }
      .masthead { padding: 16px 0 14px; }
      .wordmark { font-size: 28px; }
      .strap { display: none; }
      .feature { grid-template-columns: 1fr; gap: 24px; padding: 24px 0 44px; }
      .cover { aspect-ratio: 16 / 10; padding: 20px 20px 18px; }
      .controls { gap: 6px 20px; padding: 12px 0; }
      .tabs { flex-basis: 100%; margin-right: -20px; padding-right: 20px; }
      .tools { flex: 1 1 100%; min-width: 0; gap: 14px; }
      .tools select { flex: 0 1 auto; min-width: 0; max-width: 128px; }
      .tools input { flex: 1 1 60px; width: auto; min-width: 60px; }
      .month { padding-top: 34px; }
      .month-name { font-size: 21px; }
      .row > a { grid-template-columns: 50px minmax(0, 1fr); gap: 0 14px; padding: 14px 0; }
      .day { flex-direction: column; gap: 3px; align-items: flex-start; }
      .day-num { font-size: 32px; }
      .row-title { font-size: 17px; }
      .audio-bar { padding: 10px 16px; }
      .audio-bar-progress { max-width: 80px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="wordmark"><b>AI</b>Brief</div>
    <p class="strap">Daily AI intelligence briefing</p>
  </header>

  <div class="band"><strong>Latest</strong><span id="latest-date"></span></div>
  <section class="feature" id="feature" aria-label="Latest issue" hidden></section>

  <main>
    <div class="band"><strong>Archive</strong><span id="archive-count"></span></div>
    <div class="controls">
      <div class="tabs" id="month-tabs" role="group" aria-label="Month"></div>
      <div class="tools">
        <select id="type-select" aria-label="Edition"></select>
        <select id="tag-select" aria-label="Company"></select>
        <input id="search-input" type="search" placeholder="Search" aria-label="Search issues and stories" autocomplete="off">
      </div>
    </div>
    <div id="issue-container" aria-live="polite"></div>
  </main>
</div>

<div class="audio-bar" id="audio-bar">
  <button type="button" class="audio-bar-play" id="audio-bar-play" aria-label="Play or pause"><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg></button>
  <span class="audio-bar-title" id="audio-bar-title"></span>
  <div class="audio-bar-progress" id="audio-bar-progress"><div class="audio-bar-fill" id="audio-bar-fill"></div></div>
  <span class="audio-bar-time" id="audio-bar-time"></span>
  <audio id="main-audio"></audio>
</div>

<script>
(function () {
  var TYPES = [['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']];
  var TOPICS = 3;         // topic labels shown on a row
  var OPEN_MONTHS = 3;    // months listed in full when no month is picked
  var BASE = window.AI_BRIEF_BASE || '';
  var all = [];
  var state = { type: 'daily', month: null, tag: null, q: '', openMonths: {} };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function day(dateStr) { var p = dateStr.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(dateStr, opts) { return day(dateStr).toLocaleDateString('en-US', opts); }
  function monthKey(issue) { return issue.date.slice(0, 7); }
  function monthName(key, short) {
    return new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 1)
      .toLocaleDateString('en-US', { month: short ? 'short' : 'long', year: 'numeric' });
  }
  function count(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function labels(issue) { return (issue.stories || []).map(function (s) { return s.label; }); }

  function ofType() { return all.filter(function (x) { return x.type === state.type; }); }
  function matches(issue) {
    if (state.month && monthKey(issue) !== state.month) return false;
    if (state.tag && (issue.tags || []).indexOf(state.tag) === -1) return false;
    if (state.q) {
      var hay = [issue.headline, (issue.tags || []).join(' ')]
        .concat((issue.stories || []).map(function (s) { return s.label + ' ' + s.text; })).join(' ').toLowerCase();
      if (hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function renderControls() {
    var typeCounts = {};
    all.forEach(function (x) { typeCounts[x.type] = (typeCounts[x.type] || 0) + 1; });
    var types = TYPES.filter(function (t) { return typeCounts[t[0]]; });
    var typeSel = document.getElementById('type-select');
    typeSel.innerHTML = types.map(function (t) {
      return '<option value="' + t[0] + '"' + (state.type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
    }).join('');
    typeSel.hidden = types.length < 2;

    var pool = ofType(), order = [], seen = {}, tags = {};
    pool.forEach(function (x) {
      var k = monthKey(x);
      if (!seen[k]) { seen[k] = true; order.push(k); }
      (x.tags || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; });
    });
    document.getElementById('month-tabs').innerHTML =
      '<button type="button" class="tab" data-month="" aria-pressed="' + (!state.month) + '">All</button>' +
      order.map(function (k) {
        return '<button type="button" class="tab" data-month="' + k + '" aria-pressed="' + (state.month === k) + '">' + esc(monthName(k, true)) + '</button>';
      }).join('');
    var names = Object.keys(tags).sort(function (a, b) { return tags[b] - tags[a] || a.localeCompare(b); });
    document.getElementById('tag-select').innerHTML = '<option value="">All companies</option>' +
      names.map(function (t) { return '<option value="' + esc(t) + '"' + (state.tag === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
  }

  function renderFeature() {
    var el = document.getElementById('feature'), latest = ofType()[0];
    if (!latest) { el.hidden = true; document.getElementById('latest-date').textContent = ''; return; }
    var names = labels(latest), url = esc(BASE + latest.url);
    document.getElementById('latest-date').textContent = fmt(latest.date, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    el.innerHTML =
      '<a class="cover" href="' + url + '" aria-hidden="true" tabindex="-1">' +
      '<span class="cover-date">' + esc(fmt(latest.date, { weekday: 'short', month: 'short', day: 'numeric' })) + '</span>' +
      '<span class="cover-label">' + esc(names[0] || 'AI Brief') + '</span></a>' +
      '<div><p class="meta">' + esc(latest.type === 'weekly' ? 'Weekly edition' : latest.type === 'monthly' ? 'Monthly edition' : 'Daily edition') + '</p>' +
      '<h1 class="feature-title"><a href="' + url + '">' + esc(latest.headline) + '</a></h1>' +
      (names.length > 1 ? '<ul class="topics">' + names.slice(1, 5).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') +
      '<a class="go" href="' + url + '">Read the brief</a></div>';
    el.hidden = false;
  }
  function row(issue) {
    var names = labels(issue), url = esc(BASE + issue.url);
    var topics = names.slice(0, TOPICS).join('  /  ') + (names.length > TOPICS ? '  +' + (names.length - TOPICS) : '');
    var play = issue.audio
      ? '<button type="button" class="play-btn" data-audio="' + esc(BASE + issue.audio) + '" data-title="' + esc(issue.date) +
        '" aria-label="Play the audio edition"><svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg></button>'
      : '';
    return '<li class="row row--' + esc(issue.type) + '"><a href="' + url + '">' +
      '<span class="day"><span class="day-num">' + day(issue.date).getDate() + '</span>' +
      '<span class="day-dow">' + esc(fmt(issue.date, { weekday: 'short' })) + '</span></span>' +
      '<span><span class="row-title">' + esc(issue.headline) + '</span>' +
      (topics ? '<span class="row-topics">' + esc(topics) + '</span>' : '') + '</span></a>' + play + '</li>';
  }

  function renderIssues() {
    var shown = ofType().filter(matches);
    document.getElementById('archive-count').textContent = count(shown.length, 'issue', 'issues');
    var box = document.getElementById('issue-container');
    if (!shown.length) {
      box.innerHTML = '<p class="empty">Nothing matches. <button type="button" id="clear-filters">Clear the search and filters</button></p>';
      return;
    }
    var groups = {}, order = [];
    shown.forEach(function (x) { var k = monthKey(x); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(x); });
    var filtering = !!(state.month || state.tag || state.q);
    box.innerHTML = order.map(function (k, i) {
      var open = state.openMonths[k] != null ? state.openMonths[k] : (filtering || i < OPEN_MONTHS);
      var head = '<span class="month-name">' + esc(monthName(k)) + '</span><span class="month-n">' + count(groups[k].length, 'issue', 'issues') + '</span>';
      return '<section class="month">' +
        (open && (filtering || i < OPEN_MONTHS)
          ? '<div class="month-head">' + head + '</div>'
          : '<button type="button" class="month-head" data-month-toggle="' + k + '" aria-expanded="' + open + '">' + head +
            '<span class="month-toggle">' + (open ? 'Hide' : 'Show') + '</span></button>') +
        (open ? '<ul class="rows">' + groups[k].map(row).join('') + '</ul>' : '') + '</section>';
    }).join('');
  }

  function render() { renderControls(); renderFeature(); renderIssues(); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-month],[data-month-toggle],#clear-filters,.play-btn');
    if (!t) return;
    if (t.classList.contains('play-btn')) { playAudio(t.dataset.audio, t.dataset.title, t); return; }
    if (t.id === 'clear-filters') { state.month = null; state.tag = null; state.q = ''; document.getElementById('search-input').value = ''; }
    else if (t.dataset.monthToggle) { state.openMonths[t.dataset.monthToggle] = t.getAttribute('aria-expanded') !== 'true'; }
    else { state.month = t.dataset.month || null; state.openMonths = {}; }
    render();
  });
  document.getElementById('type-select').addEventListener('change', function () {
    state.type = this.value; state.month = null; state.tag = null; state.openMonths = {}; render();
  });
  document.getElementById('tag-select').addEventListener('change', function () { state.tag = this.value || null; renderIssues(); });
  document.getElementById('search-input').addEventListener('input', function () { state.q = this.value.trim().toLowerCase(); renderIssues(); });

  /* Audio edition */
  var currentBtn = null, audio = document.getElementById('main-audio'), bar = document.getElementById('audio-bar');
  var svgPlay = '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg>';
  var svgPause = '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><rect x="1.5" y="1" width="3" height="8"/><rect x="5.5" y="1" width="3" height="8"/></svg>';
  function clock(s) { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  audio.addEventListener('timeupdate', function () {
    if (!audio.duration) return;
    document.getElementById('audio-bar-fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    document.getElementById('audio-bar-time').textContent = clock(audio.currentTime) + ' / ' + clock(audio.duration);
  });
  audio.addEventListener('ended', function () {
    document.getElementById('audio-bar-play').innerHTML = svgPlay;
    if (currentBtn) { currentBtn.innerHTML = svgPlay; currentBtn.classList.remove('playing'); }
  });
  document.getElementById('audio-bar-play').addEventListener('click', function () {
    if (audio.paused) { audio.play(); this.innerHTML = svgPause; } else { audio.pause(); this.innerHTML = svgPlay; }
  });
  document.getElementById('audio-bar-progress').addEventListener('click', function (e) {
    if (audio.duration) audio.currentTime = (e.offsetX / this.offsetWidth) * audio.duration;
  });
  function playAudio(src, title, btn) {
    if (currentBtn && currentBtn !== btn) { currentBtn.innerHTML = svgPlay; currentBtn.classList.remove('playing'); }
    if (audio.src.slice(-src.length) === src && !audio.paused) {
      audio.pause(); btn.innerHTML = svgPlay; btn.classList.remove('playing');
      document.getElementById('audio-bar-play').innerHTML = svgPlay;
      return;
    }
    audio.src = src; audio.play();
    btn.innerHTML = svgPause; btn.classList.add('playing');
    document.getElementById('audio-bar-play').innerHTML = svgPause;
    document.getElementById('audio-bar-title').textContent = 'AI Brief, ' + title;
    bar.classList.add('visible');
    currentBtn = btn;
  }

  function start(data) {
    all = (data.issues || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    if (!all.some(function (x) { return x.type === state.type; }) && all.length) state.type = all[0].type;
    render();
  }
  if (window.AI_BRIEF_INDEX) { start(window.AI_BRIEF_INDEX); }
  else {
    fetch('index.json').then(function (r) { return r.json(); }).then(start).catch(function () {
      document.getElementById('issue-container').innerHTML = '<p class="empty">The issue list did not load. Reload the page to try again.</p>';
    });
  }
})();
</script>
</body>
</html>
